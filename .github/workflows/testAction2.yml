name: Test Action (Large commit)

on:
  workflow_dispatch:  
  repository_dispatch:
    types: [dispatch_tests]
jobs:
  Run_Custom_Action:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fromDockerHub: [true, false]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Use custom action from the root
        uses: ./
        id : customAction
        with:
          URL: "https://github.com/apache/kafka/commit/d171ff08a70f9fa8065e6661fcc1f3da092d7faf"
          screenshot: "ConfigurationControlManagerTest.java"
          fromDockerHub: ${{ matrix.fromDockerHub }}

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.fromDockerHub }}
          path: ${{ steps.customAction.outputs.screenshots_path}}
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.fromDockerHub }}
          path: ${{ steps.customAction.outputs.artifact_path}}
